<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ empresa }}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  {% if u %}
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="/panel">Pyme FollowUp</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small">{{ u.nombre }}</span>
        <a class="btn btn-outline-secondary btn-sm" href="/exportar.csv">Exportar CSV</a>
        <form method="post" action="/logout" class="m-0">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="btn btn-link btn-sm">Salir</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="container py-3">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
